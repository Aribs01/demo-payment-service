services:
  postgres:
    image: postgres:16-alpine
    container_name: transfer-postgres
    environment:
      POSTGRES_DB: transfers_db
      POSTGRES_USER: transfers
      POSTGRES_PASSWORD: transfers
    ports:
      - "5434:5432"
    volumes:
      - transfers_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfers -d transfers_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: transfer-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: transfers
      RABBITMQ_DEFAULT_PASS: transfers
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  transfers_pgdata:
