server:
  port: 3333

spring:
  application:
    name: transfer-service

  datasource:
    url: jdbc:postgresql://localhost:5433/transfers_db
    username: transfers
    password: transfers

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  rabbitmq:
    host: localhost
    port: 5672
    username: transfers
    password: transfers

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.example.transfers: DEBUG

integrations:
  fineract:
    base-url: http://localhost:3333/mock/fineract
  provider:
    base-url: http://localhost:3333/mock/provider
