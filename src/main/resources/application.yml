server:
  port: 3333

spring:
  application:
    name: transfer-service

  datasource:
    url: jdbc:postgresql://localhost:5434/transfers_db
    username: transfers
    password: transfers

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  rabbitmq:
    host: localhost
    port: 5672
    username: transfers
    password: transfers
    connection-timeout: 3s
    listener:
      simple:
        default-requeue-rejected: true
        missing-queues-fatal: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.example.transfer: DEBUG

integrations:
  fineract:
    base-url: http://localhost:3333/mock/fineract
  provider:
    base-url: http://localhost:3333/mock/provider

app:
  mocks:
    enabled: true
    admin-key: ${MOCK_ADMIN_KEY:local-mock-admin-key}
  provider:
    callback-secret: ${PROVIDER_CALLBACK_SECRET:local-provider-secret}
    callback-url: http://localhost:3333/api/v2/provider/events